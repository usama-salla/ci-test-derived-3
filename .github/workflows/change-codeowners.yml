name: Change CODEOWNERS

# Repos created from a template inherit every file on the default branch,
# including .github/CODEOWNERS. Because the SallaApp org rulesets enforce
# `require_code_owner_review` on every default branch, an inherited CODEOWNERS
# silently makes this template's maintainers required reviewers in every derived
# repo. GitHub offers no way to exclude a file from template copying, so we
# neutralise it after the fact by opening a pull request that resets it.
#
# The check gate is the CODEOWNERS file itself: if it no longer names the
# template maintainers, the workflow exits immediately. That makes this
# self-healing and idempotent — every push re-runs the workflow but it does
# nothing once CODEOWNERS is clean. No marker file, no state to manage.
#
# Two org rules shape how the commit is made:
#   * `required_signatures` on all branches — the commit is created through the
#     GraphQL API, which GitHub signs, rather than with `git commit`.
#   * branch protection on the default branch — we never push to it directly;
#     the change always lands as a pull request through the normal review flow.

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Serialize runs so overlapping pushes cannot rewind the shared PR branch.
# Without this, a later run's stale-branch repair (updateRef with force) can
# rewind history that an earlier concurrent run already committed. Queuing
# (rather than cancelling) lets the next run's check gate exit cleanly once
# the current run has opened its PR.
concurrency:
  group: change-codeowners-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bootstrap:
    name: Reset inherited CODEOWNERS
    # Never run in the template repo itself, which keeps its CODEOWNERS active.
    if: github.repository != 'usama-salla/ci-test'
    runs-on: ubuntu-latest
    steps:
      # Preferred over GITHUB_TOKEN: a pull request opened by GITHUB_TOKEN does
      # not trigger workflows, so its required checks would never report and the
      # PR could never be merged. Soft-fails if the org secrets are absent.
      - name: Generate GitHub App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GIT_APP_ID }}
          private-key: ${{ secrets.GIT_APP_PRIVATE_KEY }}
          owner: SallaApp

      - name: Reset CODEOWNERS
        uses: actions/github-script@v7
        env:
          HAS_APP_TOKEN: ${{ steps.app-token.outputs.token != '' }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const nameWithOwner = `${owner}/${repo}`;
            const CODEOWNERS = '.github/CODEOWNERS';
            const PR_BRANCH = 'feature/PO-3078-update-code-owners';
            const TITLE = 'ci(devops): reset inherited CODEOWNERS';
            // Exact-token set, not a substring regex: legitimate downstream
            // owners like `@SallaApp/platform-analytics` or `@jamalla2-tools`
            // must not match.
            const TEMPLATE_OWNERS = new Set(['@SallaApp/platform', '@jamalla2']);

            if (process.env.HAS_APP_TOKEN !== 'true') {
              core.warning(
                'GIT_APP_ID / GIT_APP_PRIVATE_KEY unavailable; falling back to GITHUB_TOKEN. ' +
                  'The pull request this opens will not trigger required checks — ' +
                  'close it and edit .github/CODEOWNERS by hand instead.'
              );
            }

            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            const base = repoInfo.default_branch;

            // Check gate: read CODEOWNERS on the default branch. If the template
            // maintainers are no longer named, there is nothing to do.
            let currentContent;
            try {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path: CODEOWNERS,
                ref: base,
              });
              currentContent = Buffer.from(data.content, 'base64').toString('utf8');
            } catch (error) {
              if (error.status === 404) {
                core.info('No CODEOWNERS file — nothing to do.');
                return;
              }
              throw error;
            }

            // Ignore comments and blank lines — only active rules assign
            // reviewers. Tokenize each active line on whitespace so an owner
            // like `@SallaApp/platform` is matched only as a whole token.
            const stillInherited = currentContent
              .split('\n')
              .map((line) => line.trim())
              .filter((line) => line && !line.startsWith('#'))
              .some((line) => line.split(/\s+/).some((token) => TEMPLATE_OWNERS.has(token)));

            if (!stillInherited) {
              core.info('CODEOWNERS no longer names the template maintainers — nothing to do.');
              return;
            }

            // Duplicate guard: only one bootstrap pull request at a time.
            const openBootstrapPull = async () =>
              (
                await github.rest.pulls.list({
                  owner,
                  repo,
                  state: 'open',
                  head: `${owner}:${PR_BRANCH}`,
                })
              ).data[0] || null;

            const alreadyOpen = await openBootstrapPull();
            if (alreadyOpen) {
              core.info(
                `Bootstrap pull request is already open: ${alreadyOpen.html_url} — merge it to finish.`
              );
              return;
            }

            const placeholder =
              [
                '# CODEOWNERS — add your own owners below, then uncomment.',
                '#',
                '# This repo was created from SallaApp/cfworker-backend-starter and',
                "# inherited that template's CODEOWNERS. Replace the entries below",
                '# with your own team or reviewers.',
                '#',
                '# Listed owners are automatically requested for review on pull requests',
                '# that touch matching paths, and the SallaApp rulesets require their',
                '# approval to merge. While every line here is commented out this repo',
                '# has no code owners, so a pull request only needs one approval from',
                '# anyone with write access.',
                '#',
                '# Docs: https://docs.github.com/articles/about-code-owners',
                '#',
                '# Examples:',
                '# *            @SallaApp/your-team',
                '# /src/api/    @alice @bob',
                '# *.toml       @SallaApp/devops',
              ].join('\n') + '\n';

            const headOf = async (branch) =>
              (await github.rest.repos.getBranch({ owner, repo, branch })).data.commit.sha;

            const baseHead = await headOf(base);

            // Create the pull request branch from the current default-branch tip.
            // If it already exists from a previous partial run (branch + commit
            // succeeded but pulls.create failed — e.g. the repo initially had
            // "Allow GitHub Actions to create and approve pull requests" turned
            // off), reuse it and skip the commit step. The previous run already
            // made the signed commit on this branch.
            let branchAlreadyExisted = false;
            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${PR_BRANCH}`,
                sha: baseHead,
              });
            } catch (error) {
              if (error.status !== 422) throw error;
              branchAlreadyExisted = true;
              core.info(
                `Branch ${PR_BRANCH} already exists from a previous partial run — ` +
                  'reusing it to open the pull request.'
              );
            }

            // Signed commit via GraphQL — satisfies the org's `required_signatures` rule.
            // Skip when reusing an existing branch; its earlier run already committed.
            if (!branchAlreadyExisted) {
              await github.graphql(
                `mutation($input: CreateCommitOnBranchInput!) {
                   createCommitOnBranch(input: $input) { commit { url } }
                 }`,
                {
                  input: {
                    branch: { repositoryNameWithOwner: nameWithOwner, branchName: PR_BRANCH },
                    expectedHeadOid: await headOf(PR_BRANCH),
                    fileChanges: {
                      additions: [
                        {
                          path: CODEOWNERS,
                          contents: Buffer.from(placeholder, 'utf8').toString('base64'),
                        },
                      ],
                    },
                    message: {
                      headline: 'ci(devops): reset inherited CODEOWNERS',
                      body:
                        'Created from SallaApp/cfworker-backend-starter. Resets the inherited ' +
                        'CODEOWNERS so the template maintainers are no longer required reviewers here.',
                    },
                  },
                }
              );
            }

            const { data: pull } = await github.rest.pulls.create({
              owner,
              repo,
              base,
              head: PR_BRANCH,
              title: TITLE,
              body: [
                'This repo was created from [`SallaApp/cfworker-backend-starter`](https://github.com/SallaApp/cfworker-backend-starter)',
                "and inherited that template's `.github/CODEOWNERS`.",
                '',
                'The SallaApp rulesets require code owner approval on the default branch, so as it stands',
                '**every pull request in this repo needs `@SallaApp/platform` to approve it**. This PR resets',
                'CODEOWNERS to an empty placeholder, which makes that requirement inert.',
                '',
                '### How to finish',
                '',
                'Edit `.github/CODEOWNERS` on this branch, replace the placeholder with your own team,',
                'then **merge this PR**. You can also merge as-is and add your team in a follow-up PR — either works.',
                '',
                '> ⚠️ **Please merge — do not close this PR without merging.** Closing it leaves the repo',
                '> with the inherited CODEOWNERS in place, and the bootstrap workflow will fail on the next',
                '> push until someone deletes the stale branch by hand.',
                '',
                '_Opened automatically by the `Change CODEOWNERS` workflow._',
              ].join('\n'),
            });

            core.info(`Pull request ready: ${pull.html_url}`);
